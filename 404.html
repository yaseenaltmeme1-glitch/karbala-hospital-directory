<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انتقل الموقع — مستشفى الإمام الحسن المجتبى (ع)</title>

<!-- التحويل الفوري: يعمل حتى لو تعطّل JavaScript -->
<meta http-equiv="refresh" content="0; url=https://ih-hos.com/">
<link rel="canonical" href="https://ih-hos.com/">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="icon.png" type="image/png">

<style>
  :root { --p:#5B3DF5; --p2:#8B6BFF; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:24px;background:#E3DCF6;color:#170F2B;
       font-family:'Segoe UI',Tahoma,system-ui,sans-serif;text-align:center}
  .box{background:#fff;border-radius:22px;padding:40px 30px;max-width:440px;width:100%;
       box-shadow:0 14px 40px rgba(45,26,110,.18)}
  .ring{width:66px;height:66px;margin:0 auto 20px;border-radius:50%;
        border:4px solid rgba(91,61,245,.18);border-top-color:var(--p);
        animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:1.22rem;margin:0 0 10px}
  p{color:#6C6288;font-size:.94rem;line-height:1.75;margin:0 0 22px}
  a.go{display:inline-block;background:linear-gradient(135deg,var(--p),var(--p2));
       color:#fff;text-decoration:none;font-weight:700;padding:13px 30px;border-radius:14px;
       box-shadow:0 8px 22px rgba(91,61,245,.36)}
  small{display:block;margin-top:18px;color:#9a93b5;font-size:.76rem}
  @media(prefers-color-scheme:dark){
    body{background:#0A0716;color:#F8F9FA}
    .box{background:#1B1236;box-shadow:0 16px 48px rgba(0,0,0,.5)}
    p{color:#B3ABD1}
  }
</style>
</head>
<body>
  <div class="box">
    <div class="ring"></div>
    <h1>الموقع انتقل إلى عنوان جديد</h1>
    <p>
      نظام مستشفى الإمام الحسن المجتبى (ع) صار على النطاق الرسمي.<br>
      يجري تحويلك الآن…
    </p>
    <a class="go" href="https://ih-hos.com/">الانتقال إلى ih-hos.com</a>
    <small>إن لم يتم التحويل خلال ثوانٍ، اضغط الزر بالأعلى.</small>
  </div>

  <script>
    /* التحويل الفوري — replace حتى لا يعلق زر الرجوع في حلقة */
    location.replace('https://ih-hos.com/' + location.search + location.hash);
  </script>
</body>
</html>
